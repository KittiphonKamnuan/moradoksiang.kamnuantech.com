[package]
name = "moradok-server"
version = "0.1.0"
edition = "2021"
description = "มรดกเสียง — API + static frontend server (replaces the Next.js server)"

[dependencies]
axum = { version = "0.8.4", features = ["multipart"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
