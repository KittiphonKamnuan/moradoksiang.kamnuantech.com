name: CI / Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: # manual redeploy from the Actions tab (main only)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s worker
      - run: npm run build

  deploy:
    # only after tests pass, only for main, never for pull requests
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, moradoksiang]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://moradoksiang.kamnuantech.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: bash scripts/deploy.sh "$GITHUB_WORKSPACE"
        env:
          MORADOK_APP_DIR: ${{ vars.MORADOK_APP_DIR }}
