name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Production now runs in Docker on the home server (web = Rust server + static export, worker = Python);
# it is deployed by hand there, so CI only tests. The old pm2 deploy job (scripts/deploy.sh) is gone.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s worker
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            server/target
          key: cargo-${{ hashFiles('server/Cargo.lock') }}
      - run: cargo test
        working-directory: server
